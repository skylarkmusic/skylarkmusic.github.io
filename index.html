<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skylarkmusic — Apps</title>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:720px;margin:0 auto;padding:48px 24px;line-height:1.7;color:#1d1a17;background:#faf7f2}
  h1{color:#8a4b2a;margin:0} .sub{color:#666;margin:8px 0 40px}
  .app{background:#fff;border:1px solid #e5ded6;border-radius:16px;padding:24px;margin-bottom:16px;display:flex;gap:20px;align-items:center}
  .icon{width:64px;height:64px;flex:none;border-radius:14px;background:#2a241f;display:flex;align-items:center;justify-content:center}
  .app h2{margin:0;font-size:18px;color:#1d1a17}
  .app p{margin:4px 0 8px;color:#666;font-size:14px}
  .app a{color:#8a4b2a;font-size:14px;margin-right:14px}
  footer{margin-top:48px;color:#999;font-size:13px;text-align:center}
</style>
</head>
<body>
<h1>skylarkmusic</h1>
<p class="sub">Developer portal &amp; app support</p>

<div class="app">
  <div class="icon">
    <svg width="40" height="40" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="30" fill="none" stroke="#c97e4e" stroke-width="2"/>
      <circle cx="36" cy="36" r="22" fill="none" stroke="#6b5646" stroke-width="1"/>
      <circle cx="36" cy="36" r="14" fill="#c97e4e"/>
      <circle cx="36" cy="36" r="4" fill="#2a241f"/>
    </svg>
  </div>
  <div>
    <h2>Skylark</h2>
    <p>An offline-first music player. Your library, your way.</p>
    <a href="https://skylarkmusic.github.io/skylark/">App Page</a>
    <a href="https://skylarkmusic.github.io/skylark/privacy.html">Privacy Policy</a>
    <a href="https://skylarkmusic.github.io/skylark/terms.html">Terms of Use</a>
  </div>
</div>

<!-- 未来新 app 在这里复制一个 .app 卡片 -->

<footer>© skylarkmusic</footer>
</body>
</html>
